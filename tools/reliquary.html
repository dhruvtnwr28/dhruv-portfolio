<!doctype html>
<!-- Test bench: tools/reliquary.html?open=.6&charge=1&flare=.2&atmos=1 -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#020403;height:100%;overflow:hidden}canvas{position:fixed;inset:0;width:100vw;height:100vh}</style></head>
<body><canvas id="s"></canvas><canvas id="r"></canvas>
<script type="module">
import { Engine } from '../js/engine.js';
import { Reliquary } from '../js/reliquary.js';
const q = new URLSearchParams(location.search);
const W = innerWidth, H = innerHeight, R = Math.min(W, H) * +(q.get('r') || .34);
const st = new Engine(document.getElementById('s'), { background: false, preserve: true });
st.resize(W, H);
st.setStone('time', [0.10, 0.92, 0.45]);
Object.assign(st.state, { time: 2, obj: [W/2, H/2, R*1.3], vis: +(q.get('open') || 0) > .02 ? 1 : 0, quality: 1, surge: +(q.get('flare') || 0) });
st.render();
const rl = new Reliquary(document.getElementById('r'), { atmos: q.get('atmos') !== '0' });
rl.resize(1);
Object.assign(rl.state, { time: 3, open: +(q.get('open') || 0), charge: +(q.get('charge') || 0), flare: +(q.get('flare') || 0), r: +(q.get('r') || .34), rot: .2 });
rl.render();
document.title = 'done';
</script></body></html>
